[package]
name = "one2md"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Convert Microsoft OneNote documents to Markdown"

[dependencies]
onenote_parser = { version = "=2.0.0", features = ["onepkg"] }
rayon = "1.11"
typed-path = "0.12"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
tempfile = "3"
